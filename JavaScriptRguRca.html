<script>
let rguWhitelist = [];
let rguSelectedEmp = null;

function openRguRcaModule() {
  toggleLoading(true);
  google.script.run
    .withSuccessHandler(res => {
      toggleLoading(false);
      if (!res.success) return showToast(res.message, 'error');
      
      document.getElementById('view-gateway').classList.add('hidden');
      document.getElementById('view-RCA').classList.remove('hidden');

      if (res.isAdmin) {
        document.getElementById('view-rgu-admin').classList.remove('hidden');
        rguRenderAdminTable(res.reportData);
        document.getElementById('rgu-toggle-modulo').checked = res.isAttivo;
      } else {
        document.getElementById('view-rgu-inst').classList.remove('hidden');
        document.getElementById('rgu-denom-ist').innerText = res.denom;
        rguWhitelist = res.anagrafica;
        rguSetupAutocomplete();
        rguRenderInstTables(res.attivi, res.storico);
      }
    })
    .withFailureHandler(handleServerError)
    .fetchRguRcaData(currentUser.token);
}

function rguSetupAutocomplete() {
  const input = document.getElementById('rgu-search-emp');
  const list = document.getElementById('rgu-list-emp');
  
  input.addEventListener('input', function() {
    const val = this.value.toLowerCase();
    list.innerHTML = '';
    rguSelectedEmp = null;
    document.getElementById('rgu-profilo-sel').value = "";
    rguHandleConditionalFields();
    
    if (!val) { list.classList.remove('show'); return; }

    const filtered = rguWhitelist.filter(i => 
       i.cognome.toLowerCase().includes(val) || 
       i.nome.toLowerCase().includes(val) || 
       i.cf.toLowerCase().includes(val)
    );

    if (filtered.length === 0) { list.classList.remove('show'); return; }

    filtered.forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'dropdown-item';
      a.style.cursor = 'pointer';
      a.innerHTML = `<strong>${item.cognome} ${item.nome}</strong> <span class="text-muted small">(${item.cf})</span>`;
      
a.addEventListener('click', () => {
        input.value = `${item.cognome} ${item.nome}`;
        list.classList.remove('show');
        rguSelectedEmp = item;
        const profSel = document.getElementById('rgu-profilo-sel');
        
        // Pulizia di eventuali opzioni dinamiche residue generate in precedenza
        const oldDynamicOpt = profSel.querySelector('.dynamic-profile-option');
        if (oldDynamicOpt) oldDynamicOpt.remove();

        if (item.profilo) {
          const profTarget = item.profilo.trim();
          // 1. Ricerca di un abbinamento esatto (case-insensitive)
          let match = Array.from(profSel.options).find(o => o.value.toLowerCase() === profTarget.toLowerCase());
          
          // 2. Fallback: Ricerca di un abbinamento parziale intelligente (es: "Docente Associato" contiene "Docente")
          if (!match && profTarget !== "Dato mancante, necessaria verifica") {
            match = Array.from(profSel.options).find(o => o.value && (profTarget.toLowerCase().includes(o.value.toLowerCase()) || o.value.toLowerCase().includes(profTarget.toLowerCase())));
          }
          
          if (match) {
            profSel.value = match.value;
          } else if (profTarget !== "Dato mancante, necessaria verifica") {
            // 3. Fallback Estremo: Se la stringa in colonna F è totalmente personalizzata, la iniettiamo per popolarla direttamente
            const newOpt = document.createElement('option');
            newOpt.value = profTarget;
            newOpt.text = profTarget;
            newOpt.className = 'dynamic-profile-option';
            profSel.appendChild(newOpt);
            profSel.value = profTarget;
          }
        }
        rguHandleConditionalFields();
      });
      li.appendChild(a);
      list.appendChild(li);
    });
    list.classList.add('show');
  });
}

function rguHandleConditionalFields() {
  const profValue = document.getElementById('rgu-profilo-sel').value;
  const prof = profValue ? profValue.toLowerCase() : '';
  const boxCda = document.getElementById('rgu-ad-interim-box');
  const boxDoc = document.getElementById('rgu-docente-box');
  
  boxCda.classList.add('hidden');
  boxDoc.classList.add('hidden');

  if (prof.includes('funzionario') || prof.includes('assistente')) {
    boxCda.classList.remove('hidden');
  } else if (prof.includes('docente')) {
    boxDoc.classList.remove('hidden');
  }
  rguValidateForm();
}

function rguValidateForm() {
  const btn = document.getElementById('rgu-btn-submit');
  const profValue = document.getElementById('rgu-profilo-sel').value;
  const prof = profValue ? profValue.toLowerCase() : '';
  const target = document.getElementById('rgu-ruolo-target').value;
  let isValid = !!(rguSelectedEmp && profValue && target);

  if (prof.includes('funzionario') || prof.includes('assistente')) {
    if (!document.getElementById('rgu-chk-cda').checked) isValid = false;
  }
  if (prof.includes('docente')) {
    const qual = document.getElementById('rgu-docente-qualifica').value;
    const nota = document.getElementById('rgu-docente-nota').value.trim();
    if (!qual || nota.length < 10) isValid = false;
  }
  btn.disabled = !isValid;
}

function rguSubmitNomina() {
  const payload = {
    nome: rguSelectedEmp.nome,
    cognome: rguSelectedEmp.cognome,
    cf: rguSelectedEmp.cf,
    ruoloTarget: document.getElementById('rgu-ruolo-target').value,
    profiloSelezionato: document.getElementById('rgu-profilo-sel').value,
    flagIncaricoCdaAdInterim: document.getElementById('rgu-chk-cda').checked,
    qualificaDirettivaDocente: document.getElementById('rgu-docente-qualifica').value,
    notaGiustificativaDocente: document.getElementById('rgu-docente-nota').value
  };

  toggleLoading(true);
  google.script.run
    .withSuccessHandler(res => {
      if (res.success) {
        showToast(res.message, 'success');
        // Reset form e Ricarica Dati
document.getElementById('rgu-search-emp').value = '';
        document.getElementById('rgu-ruolo-target').value = '';
        document.getElementById('rgu-profilo-sel').value = '';
        document.getElementById('rgu-chk-cda').checked = false;
        document.getElementById('rgu-docente-nota').value = '';
        rguSelectedEmp = null;
        rguHandleConditionalFields();
        openRguRcaModule();
      } else {
        toggleLoading(false);
        showToast(res.message, 'error');
      }
    })
    .withFailureHandler(handleServerError)
    .saveRguRcaNominee(currentUser.token, payload);
}

function rguTerminate(idTrans, ruolo) {
  confirmActionModal("Confermi la cessazione dell'incarico per questo soggetto?", () => {
    toggleLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        if(res.success) { showToast(res.message, 'success'); openRguRcaModule(); }
        else { toggleLoading(false); showToast(res.message, 'error'); }
      })
      .withFailureHandler(handleServerError)
      .terminateRguRcaNominee(currentUser.token, { idTransNominaOriginale: idTrans, ruoloControllo: ruolo });
  });
}

function rguRenderInstTables(attiviMap, storico) {
  const tbA = document.getElementById('rgu-tbody-attivi');
  const tbS = document.getElementById('rgu-tbody-storico');
  tbA.innerHTML = ''; tbS.innerHTML = '';

  const attivi = Object.values(attiviMap);
  if (attivi.length === 0) tbA.innerHTML = '<tr><td colspan="6" class="text-center">Nessun responsabile attivo.</td></tr>';
  else {
    attivi.forEach(r => {
      const d = new Date(r.dataAttivazione).toLocaleDateString('it-IT');
      tbA.innerHTML += `
        <tr>
          <td class="fw-bold">${r.ruoloControllato}</td>
          <td>${r.cognome} ${r.nome}</td>
          <td>${r.codiceFiscale}</td>
          <td>${r.profiloSelezionato}</td>
          <td>${d}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-danger" onclick="rguTerminate('${r.idTransazione}', '${r.ruoloControllato}')"><i class="fas fa-trash"></i></button>
          </td>
        </tr>`;
    });
  }

  if (storico.length === 0) tbS.innerHTML = '<tr><td colspan="5" class="text-center">Nessun dato storico.</td></tr>';
  else {
    storico.forEach(r => {
      const dIn = new Date(r.dataAttivazione).toLocaleDateString('it-IT');
      const dOut = new Date(r.dataCessazione).toLocaleDateString('it-IT');
      tbS.innerHTML += `
        <tr>
          <td class="fw-bold text-muted">${r.ruoloControllato}</td>
          <td>${r.cognome} ${r.nome}</td>
          <td>${r.codiceFiscale}</td>
          <td>${dIn}</td>
          <td>${dOut}</td>
        </tr>`;
    });
  }
}

function rguRenderAdminTable(report) {
  const tb = document.getElementById('rgu-tbody-admin');
  if (!tb) return;
  tb.innerHTML = ''; // Svuota la tabella prima di appenderne i nuovi elementi

  if (!report || report.length === 0) {
    tb.innerHTML = '<tr><td colspan="4" class="text-center text-muted p-3">Nessun dato disponibile nel report.</td></tr>';
    return;
  }

  report.forEach(r => {
    // Definizione dinamica e sicura delle classi CSS per i Badge Ministeriali
    let badgeRgu = (r.statoRgu === 'ATTIVO') ? 'bg-success' : 'bg-secondary';
    let badgeRca = (r.statoRca === 'ATTIVO') ? 'bg-success' : ((r.statoRca === 'PARZIALE') ? 'bg-warning text-dark' : 'bg-secondary');

    tb.innerHTML += `
      <tr>
        <td class="fw-bold">${escapeHtml(r.denominazione)}</td>
        <td class="text-center"><span class="badge ${badgeRgu}">${r.statoRgu}</span></td>
        <td class="text-center"><span class="badge ${badgeRca}">${r.statoRca}</span></td>
        <td class="text-center">
          <button class="btn btn-sm btn-primary" onclick="rguShowInstitutionDetail('${r.id}')" title="Ispeziona Dettagli">
            <i class="fas fa-search-plus"></i>
          </button>
        </td>
      </tr>`;
  });
}

function rguToggleModulo(checked) {
  toggleLoading(true);
  google.script.run
    .withSuccessHandler(res => {
      toggleLoading(false);
      if (res.success) {
        showToast(res.message, 'success');
      } else {
        showToast(res.message, 'error');
        document.getElementById('rgu-toggle-modulo').checked = !checked;
      }
    })
    .withFailureHandler(err => {
      toggleLoading(false);
      showToast(err.message, 'error');
      document.getElementById('rgu-toggle-modulo').checked = !checked;
    })
    .toggleRguRcaModulo(currentUser.token, checked);
}

function rguShowInstitutionDetail(idIst) {
  toggleLoading(true);
  google.script.run
    .withSuccessHandler(res => {
      toggleLoading(false);
      if (!res.success) return showToast(res.message, 'error');

      // Impostazione titolo dinamico della modale
      document.getElementById('modalDettagliRguRcaLabel').innerText = `Dettaglio Copertura RGU / RCA - ${res.denom}`;

      const tbA = document.getElementById('rgu-modal-tbody-attivi');
      const tbS = document.getElementById('rgu-modal-tbody-storico');
      tbA.innerHTML = '';
      tbS.innerHTML = '';

      // Rendering Soggetti Attivi
      if (res.attivi.length === 0) {
        tbA.innerHTML = '<tr><td colspan="6" class="text-center text-muted p-3">Nessun responsabile attivo per questa istituzione.</td></tr>';
      } else {
        res.attivi.forEach(r => {
          const dNom = new Date(r.dataAttivazione).toLocaleDateString('it-IT');
          let condizionali = '-';
          if (r.profiloSelezionato === 'Docente') {
            condizionali = `<strong>Direzione:</strong> ${r.qualificaDirettivaDocente || 'N/D'}<br><small class="text-muted text-wrap">Motivazione: ${r.notaGiustificativaDocente || ''}</small>`;
          } else if (r.flagIncaricoCdaAdInterim) {
            condizionali = `<span class="badge bg-warning text-dark"><i class="fas fa-gavel me-1"></i>Delibera CdA (Ad Interim)</span>`;
          }
          tbA.innerHTML += `
            <tr>
              <td class="fw-bold text-primary">${r.ruoloControllato}</td>
              <td>${r.cognome} ${r.nome}</td>
              <td><code>${r.codiceFiscale}</code></td>
              <td>${r.profiloSelezionato}</td>
              <td>${dNom}</td>
              <td>${condizionali}</td>
            </tr>`;
        });
      }

      // Rendering Storico Cessazioni
      if (res.storico.length === 0) {
        tbS.innerHTML = '<tr><td colspan="7" class="text-center text-muted p-3">Nessun dato d\'archivio storico per questa istituzione.</td></tr>';
      } else {
        res.storico.forEach(r => {
          const dIn = new Date(r.dataAttivazione).toLocaleDateString('it-IT');
          const dOut = r.dataCessazione ? new Date(r.dataCessazione).toLocaleDateString('it-IT') : 'N/D';
          tbS.innerHTML += `
            <tr>
              <td class="fw-bold text-muted">${r.ruoloControllato}</td>
              <td>${r.cognome} ${r.nome}</td>
              <td><code>${r.codiceFiscale}</code></td>
              <td>${r.profiloSelezionato}</td>
              <td>${dIn}</td>
              <td>${dOut}</td>
              <td><span class="text-danger small fw-bold">${r.motivoCessazione || 'N/A'}</span></td>
            </tr>`;
        });
      }

      // Apertura programmata della modale Bootstrap 5
      const modalInstance = new bootstrap.Modal(document.getElementById('modalDettagliRguRca'));
      modalInstance.show();
    })
    .withFailureHandler(handleServerError)
    .fetchInstitutionDetailForMinistero(currentUser.token, idIst);
}
</script>
