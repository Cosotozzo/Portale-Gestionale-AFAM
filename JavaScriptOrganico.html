<script>
/**
 * JAVASCRIPT PER MODULO SCAMBIO BUDGET
 * Logica: Autocomplete, Validazione Zero Trust e Gestione UI
 */

// Variabile globale per mappare Denominazione -> ID Istituzione
window.listaIstituzioniGlobal = [];

/**
 * Inizializzazione al caricamento
 */
document.addEventListener('DOMContentLoaded', function() {
    caricaDashboard();
});

/**
 * Recupera i dati dal server (Dashboard e Anagrafica Istituzioni)
 */
function caricaDashboard() {
    mostraLoading(true);
    google.script.run
        .withSuccessHandler(renderDashboard)
        .withFailureHandler(errorHandler)
        .getBudgetDashboardData(getAuthToken());
}

/**
 * Renderizza i dati della Dashboard (Admin o Istituzione)
 */
function renderDashboard(res) {
    mostraLoading(false);
    if (!res.success) {
        Swal.fire('Attenzione', res.message, 'warning');
        return;
    }

    // --- POPOLAMENTO AUTOCOMPLETE ---
    // Gestiamo la lista istituzioni ricevuta dal server
    if (res.istituzioni) {
        aggiornaAutocompleteIstituzioni(res.istituzioni);
    }

    if (res.isAdmin) {
        renderAdminView(res.report);
        // Gestione Master Switch
        const switchEl = document.getElementById('masterSwitchBudget');
        if (switchEl) switchEl.checked = res.isAttivo;
    } else {
        renderUserView(res.stats, res.transazioni);
    }
}

/**
 * Funzione per popolare il datalist dell'autocomplete
 */
function aggiornaAutocompleteIstituzioni(istituzioni) {
    const datalist = document.getElementById('listaIstituzioni');
    if (!datalist) return;

    datalist.innerHTML = ''; // Pulizia
    window.listaIstituzioniGlobal = istituzioni; // Salvataggio per il mapping ID

    istituzioni.forEach(ist => {
        const option = document.createElement('option');
        option.value = ist.nome; // Visualizza la Denominazione (Colonna B)
        datalist.appendChild(option);
    });
}

/**
 * Gestione invio nuova richiesta
 */
function inviaRichiesta() {
    const nomeSelezionato = document.getElementById('cedenteInput').value;
    const importo = document.getElementById('importoRichiesto').value;
    const note = document.getElementById('noteRichiesta').value;

    // --- LOGICA MAPPING NOME -> ID ---
    const istFound = window.listaIstituzioniGlobal.find(i => i.nome === nomeSelezionato);

    if (!istFound) {
        Swal.fire('Errore', 'Selezionare un\'Istituzione valida dalla lista suggerita.', 'error');
        return;
    }

    if (!importo || importo <= 0) {
        Swal.fire('Errore', 'Inserire un importo valido.', 'error');
        return;
    }

    const payload = {
        cedenteId: istFound.id, // Inviamo l'ID (Colonna A) al backend
        importo: importo,
        note: note
    };

    mostraLoading(true);
    google.script.run
        .withSuccessHandler(function() {
            bootstrap.Modal.getInstance(document.getElementById('modalNuovaRichiesta')).hide();
            Swal.fire('Successo', 'Richiesta inviata correttamente.', 'success');
            caricaDashboard(); // Refresh
        })
        .withFailureHandler(errorHandler)
        .submitBudgetRequest(getAuthToken(), payload);
}

/**
 * Renderizza la vista per il Ministero (Admin)
 */
function renderAdminView(report) {
    const container = document.getElementById('adminReportContainer');
    if (!container) return;
    
    let html = `
    <table class="table table-striped table-hover mt-3">
        <thead>
            <tr>
                <th>Istituzione</th>
                <th>Budget Iniziale</th>
                <th>Valore Scambio</th>
                <th>Residuo Attuale</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>`;
    
    report.forEach(row => {
        html += `
        <tr>
            <td>${row.nome}</td>
            <td>€ ${formatMoney(row.budgetBase)}</td>
            <td class="${row.valoreScambio >= 0 ? 'text-success' : 'text-danger'}">
                € ${formatMoney(row.valoreScambio)}
            </td>
            <td><strong>€ ${formatMoney(row.residuo)}</strong></td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="visualizzaDettaglioAdmin('${row.id}')">
                    Dettaglio
                </button>
            </td>
        </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
}

/**
 * Renderizza la vista per la singola Istituzione
 */
function renderUserView(stats, transazioni) {
    // Update Stats
    document.getElementById('statSaldoIniziale').innerText = '€ ' + formatMoney(stats.saldoIniziale);
    document.getElementById('statEntrate').innerText = '€ ' + formatMoney(stats.entrateAccettate);
    document.getElementById('statUscite').innerText = '€ ' + formatMoney(stats.uscitePendenti);
    document.getElementById('statSaldoDisponibile').innerText = '€ ' + formatMoney(stats.saldoDisponibile);

    // Update Table
    const tbody = document.getElementById('tableTransazioniBody');
    if (!tbody) return;

    tbody.innerHTML = transazioni.map(t => `
        <tr>
            <td>${t.data}</td>
            <td><span class="badge ${t.tipo === 'INVIATA' ? 'bg-primary' : 'bg-info'}">${t.tipo}</span></td>
            <td>${t.partner}</td>
            <td>€ ${formatMoney(t.importo)}</td>
            <td>${renderStatoBadge(t.stato)}</td>
            <td>
               ${t.stato === 'INVIATA' && t.tipo === 'RICEVUTA' ? `<button class="btn btn-sm btn-success" onclick="gestisciRichiesta('${t.id}', 'ACCETTA')">Accetta</button>` : ''}
            </td>
        </tr>
    `).join('');
}

/**
 * Utility: Formattazione valuta
 */
function formatMoney(amount) {
    return Number(amount).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/**
 * Utility: Badge stato
 */
function renderStatoBadge(stato) {
    const map = {
        'INVIATA': 'bg-secondary',
        'ACCETTATA': 'bg-success',
        'RIFIUTATA': 'bg-danger',
        'ANNULLATA_MINISTERO': 'bg-warning text-dark'
    };
    return `<span class="badge ${map[stato] || 'bg-light'}">${stato}</span>`;
}

/**
 * Utility: Spinner e Overlay
 */
function mostraLoading(show) {
    const loader = document.getElementById('loaderOverlay');
    if (loader) loader.style.display = show ? 'flex' : 'none';
}

function errorHandler(error) {
    mostraLoading(false);
    Swal.fire('Errore di Sistema', error.message, 'error');
}

function getAuthToken() {
    return localStorage.getItem('afam_session_token');
}

</script>
