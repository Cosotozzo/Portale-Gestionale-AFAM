<script>
/**
 * JAVASCRIPT PER MODULO SCAMBIO BUDGET
 * Logica: Autocomplete, Validazione Zero Trust e Gestione UI
 */

// Variabile globale per mappare Denominazione -> ID Istituzione
window.listaIstituzioniGlobal = [];

/**
 * Inizializzazione chiamata dal file JavaScript.html quando si apre il modulo
 */
function initBudgetModulo() {
    caricaDashboard();
}

/**
 * Recupera i dati dal server (Dashboard e Anagrafica Istituzioni)
 */
function caricaDashboard() {
    mostraLoading(true);
    google.script.run
        .withSuccessHandler(renderDashboard)
        .withFailureHandler(errorHandler)
        .getBudgetDashboardData(getAuthToken());
}

/**
 * Renderizza i dati della Dashboard (Admin o Istituzione)
 */
function renderDashboard(res) {
    mostraLoading(false);
    if (!res.success) {
        showToast(res.message, 'warning');
        return;
    }

    // --- POPOLAMENTO AUTOCOMPLETE ---
    if (res.istituzioni) {
        aggiornaAutocompleteIstituzioni(res.istituzioni);
    }

    if (res.isAdmin) {
        // Mostra Container Admin e Nasconde Istituzione (Prevenzione SPA collision)
        document.getElementById('ministero-budget-container').classList.remove('d-none');
        document.getElementById('istituzione-budget-container').classList.add('d-none');
        
        renderAdminView(res.report);
        
        // Imposta Master Switch
        const switchEl = document.getElementById('masterSwitchBudget');
        if (switchEl) switchEl.checked = res.isAttivo;
    } else {
        // Mostra Container Istituzione e Nasconde Admin (Prevenzione SPA collision)
        document.getElementById('istituzione-budget-container').classList.remove('d-none');
        document.getElementById('ministero-budget-container').classList.add('d-none');
        
        renderUserView(res.stats, res.transazioni);
    }

    // Mostra la vista solo ORA, quando i dati vecchi sono stati sovrascritti
    if (typeof showView === 'function') {
        showView('view-ScambioBudgetOrganico');
    }
}

function aggiornaAutocompleteIstituzioni(istituzioni) {
    window.listaIstituzioniGlobal = istituzioni; 
    const inputEl = document.getElementById('cedenteInput');
    const listEl = document.getElementById('listaIstituzioniDrop');
    
    if (!inputEl || !listEl) return;

    // Rimuoviamo eventuali listener precedenti clonando l'elemento (previene trigger multipli in caso di re-rendering)
    const clone = inputEl.cloneNode(true);
    inputEl.parentNode.replaceChild(clone, inputEl);
    
    const nomiIstituzioni = istituzioni.map(i => i.nome);
    
    clone.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        listEl.innerHTML = ''; 
        
        if (!val) {
            listEl.classList.remove('show');
            return;
        }

        const filtered = nomiIstituzioni.filter(i => i.toLowerCase().includes(val));

        if (filtered.length === 0) {
            listEl.classList.remove('show');
            return;
        }

        filtered.forEach(item => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.className = 'dropdown-item small py-2';
            a.style.cursor = 'pointer';
            a.innerText = item; 
            
            a.addEventListener('click', function() {
                clone.value = item;
                listEl.classList.remove('show');
            });
            
            li.appendChild(a);
            listEl.appendChild(li);
        });

        listEl.classList.add('show');
    });

    // Chiusura menu al click esterno
    document.addEventListener('click', function(e) {
        if (e.target !== clone && e.target !== listEl) {
            listEl.classList.remove('show');
        }
    });
}

// --- LOGICA FORMATTAZIONE VALUTA ---
function formattaImportoSuBlur(input) {
    if (!input.value) return;
    // Sostituisce la virgola con punto, rimuove eventuali puntini delle migliaia
    let valStr = input.value.replace(/\./g, '').replace(',', '.');
    let valFloat = parseFloat(valStr);
    
    if (!isNaN(valFloat)) {
        input.value = valFloat.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
}

function pulisciImportoSuFocus(input) {
    if (!input.value) return;
    // Rimuove i puntini delle migliaia per facilitare il ritocco del numero senza rompere la sintassi
    input.value = input.value.replace(/\./g, '');
}

/**
 * Apri Modal Nuova Richiesta (Allineato a HTML)
 */
function openNuovaRichiestaModal() {
    // Pulisce i campi prima di aprire
    document.getElementById('formRichiestaBudget').reset();
    const modal = new bootstrap.Modal(document.getElementById('modalRichiestaBudget'));
    modal.show();
}

/**
 * Gestione invio nuova richiesta (Allineato agli ID del Frontend)
 */
function submitRichiestaBudget() {
    const nomeSelezionato = document.getElementById('cedenteInput').value;
    const importoRaw = document.getElementById('inputImporto').value;
    const note = document.getElementById('inputNote').value;

const checkDelibera = document.getElementById('checkDelibera').checked;

    if (!checkDelibera) {
        showToast("È obbligatorio confermare la delibera di variazione di organico.", "error");
        return;
    }

    // --- LOGICA MAPPING NOME -> ID ---
    const istFound = window.listaIstituzioniGlobal.find(i => i.nome === nomeSelezionato);

    if (!istFound) {
        showToast('Selezionare un\'Istituzione valida dalla lista suggerita.', 'error');
        return;
    }

    // Pulisce la stringa valuta (es. "10.000,00" -> "10000.00") prima dell'invio al backend
    const importoPulito = importoRaw.replace(/\./g, '').replace(',', '.');
    const importo = parseFloat(importoPulito);

    if (isNaN(importo) || importo <= 0) {
        showToast('Inserire un importo valido.', 'error');
        return;
    }

    const payload = {
        cedenteId: istFound.id, // Inviamo l'ID (Colonna A) al backend
        importo: importo,
        note: note,
        confermaDelibera: checkDelibera
    };

    mostraLoading(true);
    google.script.run
        .withSuccessHandler(function() {
            bootstrap.Modal.getInstance(document.getElementById('modalRichiestaBudget')).hide();
            showToast('Richiesta inviata correttamente.', 'success');
            caricaDashboard();
        })
        .withFailureHandler(errorHandler)
        .submitBudgetRequest(getAuthToken(), payload);
}

/**
 * Renderizza la vista per il Ministero (Admin)
 */
function renderAdminView(report) {
    const tbody = document.getElementById('tbodyMinisteroBudget');
    if (!tbody) return;
    
    let html = '';
    report.forEach(row => {
html += `
        <tr data-scambio="${row.valoreScambio}">
            <td class="fw-bold text-start">${row.nome}</td>
            <td class="text-end">€ ${formatMoney(row.budgetBase)}</td>
            <td class="text-end ${row.valoreScambio >= 0 ? 'text-success' : 'text-danger'}">€ ${formatMoney(row.valoreScambio)}</td>
            <td class="text-end fw-bold">€ ${formatMoney(row.residuo)}</td>
            <td class="text-center">
                <button class="btn btn-sm btn-outline-primary" onclick="visualizzaDettaglioAdmin('${row.id}')">
                    <i class="fas fa-search me-1"></i>Dettaglio
                </button>
            </td>
        </tr>`;
    });

    tbody.innerHTML = html;
}

/**
 * Filtro tabella Admin (Live Search)
 */
function filtraTabellaAdmin() {
const input = document.getElementById('filtroIstituzioniAdmin').value.toLowerCase();
    const selectScambio = document.getElementById('filtroScambioAdmin');
    const filtroScambio = selectScambio ? selectScambio.value : 'ALL';
    
    const rows = document.querySelectorAll('#tbodyMinisteroBudget tr');
    
    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        const matchTesto = text.includes(input);
        
        const valoreScambio = parseFloat(row.getAttribute('data-scambio')) || 0;
        let matchScambio = true;
        
        if (filtroScambio === 'POS') {
            matchScambio = valoreScambio > 0;
        } else if (filtroScambio === 'NEG') {
            matchScambio = valoreScambio < 0;
        } else if (filtroScambio === 'ANY') {
            matchScambio = valoreScambio !== 0;
        }
        
        row.style.display = (matchTesto && matchScambio) ? '' : 'none';
    });
}

/**
 * Gestione Switch Attivazione/Disattivazione Modulo da parte dell'Admin
 */
function handleMasterSwitchChange(el) {
    const newState = el.checked;
    mostraLoading(true);
    google.script.run
        .withSuccessHandler(res => {
            mostraLoading(false);
            if(res.success) {
                showToast(res.message, 'success');
            } else {
                showToast(res.message, 'error');
                el.checked = !newState; // Rollback visivo in caso di errore logico
            }
        })
        .withFailureHandler(err => {
            mostraLoading(false);
            showToast(err.message, 'error');
            el.checked = !newState; // Rollback visivo in caso di fallimento server
        })
        .toggleScambioBudget(getAuthToken(), newState);
}

/**
 * Renderizza la vista per la singola Istituzione (Allineato agli ID del Frontend)
 */
function renderUserView(stats, transazioni) {
    // Update Stats Box
    const bdgDisponibileEl = document.getElementById('stat-budget-disponibile');
    if(bdgDisponibileEl) bdgDisponibileEl.innerText = '€ ' + formatMoney(stats.saldoDisponibile);
    
    const reqAttiveEl = document.getElementById('stat-richieste-attive');
    if(reqAttiveEl) reqAttiveEl.innerText = stats.richiesteAttive || '0';
    
    const scambiAccettatiEl = document.getElementById('stat-scambi-accettati');
    if(scambiAccettatiEl) scambiAccettatiEl.innerText = stats.scambiAccettati || '0';

    const scambiRifiutatiEl = document.getElementById('stat-scambi-rifiutati');
    if(scambiRifiutatiEl) scambiRifiutatiEl.innerText = stats.scambiRifiutati || '0';

    // Update Table
    const tbody = document.getElementById('tbodyIstituzioneBudget');
    if (!tbody) return;

    tbody.innerHTML = transazioni.map(t => {
        let actionsHtml = '<div class="d-flex justify-content-center align-items-center gap-1">';
        let hasActions = false;

        // Se l'istituzione ha ricevuto la richiesta e la richiesta è ancora nello stato INVIATA
        if (t.stato === 'INVIATA' && t.tipo === 'RICEVUTA') {
            actionsHtml += `
                <button class="btn btn-sm btn-success rounded-pill shadow-sm" onclick="gestisciRichiesta('${t.id}', 'ACCETTATA')" title="Accetta"><i class="fas fa-check"></i></button>
                <button class="btn btn-sm btn-danger rounded-pill shadow-sm" onclick="gestisciRichiesta('${t.id}', 'RIFIUTATA')" title="Rifiuta"><i class="fas fa-times"></i></button>
            `;
            hasActions = true;
        }

// Se la richiesta non è rifiutata, NON è accettata e non è stata annullata, l'utente può annullarla
        if (t.stato !== 'RIFIUTATA' && t.stato !== 'ACCETTATA' && !t.stato.includes('ANNULLATA')) {
            actionsHtml += `
                <button class="btn btn-sm btn-warning rounded-pill shadow-sm text-dark" onclick="handleAnnullaP2P('${t.id}')" title="Annulla Transazione"><i class="fas fa-undo"></i></button>
            `;
            hasActions = true;
        }

        actionsHtml += '</div>';

        return `
            <tr class="text-center align-middle" style="height: 60px;">
                <td class="align-middle">${t.data}</td>
                <td class="fw-bold align-middle">${t.partner}</td>
                <td class="align-middle"><span class="badge ${t.tipo === 'INVIATA' ? 'bg-primary' : 'bg-info'}">${t.tipo}</span></td>
                <td class="fw-bold align-middle">€ ${formatMoney(t.importo)}</td>
                <td class="align-middle">${renderStatoBadge(t.stato)}</td>
                <td class="align-middle">
                    ${hasActions ? actionsHtml : '-'}
                </td>
            </tr>
        `;
    }).join('');
}

/**
 * Utility: Formattazione valuta
 */
function formatMoney(amount) {
    return Number(amount).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/**
 * Utility: Badge stato
 */
function renderStatoBadge(stato) {
    const map = {
        'INVIATA': 'bg-secondary',
        'ACCETTATA': 'bg-success',
        'RIFIUTATA': 'bg-danger',
        'ANNULLATA_MINISTERO': 'bg-warning text-dark',
        'ANNULLATA_ISTITUTO': 'bg-warning text-dark'
    };
    return `<span class="badge ${map[stato] || 'bg-light text-dark'}">${stato}</span>`;
}

/**
 * Utility: Spinner e Overlay
 */
function mostraLoading(show) {
    // Deleghiamo la visualizzazione alla funzione globale del Portale (JavaScript.html)
    if (typeof toggleLoading === 'function') {
        toggleLoading(show);
    }
}

function errorHandler(error) {
    mostraLoading(false);
    showToast(error.message, 'error');
}

function getAuthToken() {
    // Corretto l'accesso coerente allo Storage del portale principale
    return sessionStorage.getItem('AFAM_SESSION_TOKEN');
}

/**
 * Recupera e mostra i dettagli (storico richieste) per una specifica istituzione lato Admin.
 * @param {string} idIstituzione - Il codice o l'ID dell'istituzione cliccata
 */
window.visualizzaDettaglioAdmin = function(idIstituzione) {
    if (!idIstituzione) return;

    mostraLoading(true);
    
    // Richiamata al controller (Code.gs) per ottenere lo storico
    google.script.run
        .withSuccessHandler(function(res) {
            mostraLoading(false);
            if (!res.success) {
                showToast(res.message || 'Errore nel recupero dello storico', 'error');
                return;
            }
            
// Estrapoliamo il ruolo dell'utente globale in modo sicuro
            const ruoloUtente = (currentUser && currentUser.role) ? String(currentUser.role).toUpperCase().trim() : '';
            
            // Renderizza i dati e apri la modale passando esplicitamente il ruolo
            renderTabellaDettagliAdmin(res.storico, ruoloUtente);
            
            const modalEl = document.getElementById('modalDettagliAdmin');
            if (modalEl) {
                // Inizializza e mostra la modale di Bootstrap 5
                const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
                modalInstance.show();
            } else {
                console.error("Modale 'modalDettagliAdmin' non trovata nel DOM.");
            }
        })
        .withFailureHandler(errorHandler)
        // Sostituisci getStoricoIstituzione con il nome reale della tua funzione backend in Code.gs se differisce
        .getStoricoIstituzione(getAuthToken(), idIstituzione); 
};

/**
 * Funzione di appoggio per iniettare l'HTML nella modale
 * Gestisce sia ADMIN che MINISTERO
 */
function renderTabellaDettagliAdmin(storico, userRole) {
    const tbody = document.getElementById('bodyTabellaDettagliAdmin');
    if (!tbody) return;
    
// INIZIO MODIFICA
// Definiamo i ruoli che hanno accesso alle funzioni di annullamento
    const isAuthorized = (userRole === 'ADMIN' || userRole === 'MINISTERO');
    
    if (!storico || storico.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${isAuthorized ? 6 : 5}" class="text-center">Nessuna transazione trovata.</td></tr>`;
        return;
    }
    
    let html = '';
    storico.forEach(req => {
        let actionsHtml = '';
        let tipoDisplay = req.tipo || '-';
        let rowClass = '';

        // Intercettazione e normalizzazione UX degli stati annullati
        if (req.stato && req.stato.includes('ANNULLATA')) {
            tipoDisplay = req.stato === 'ANNULLATA_MINISTERO' ? 'ROLLBACK MINISTERO' : 'REVOCATA ISTITUZIONE';
            // Feedback visivo: riga opacizzata e barrata per differenziarla dalle transazioni attive
            rowClass = 'text-muted text-decoration-line-through opacity-75'; 
        }

        if (isAuthorized) {
            // Se autorizzato, mostriamo il pulsante solo se lo stato è ACCETTATA
            actionsHtml = (req.stato === 'ACCETTATA') 
                ? `<button class="btn btn-sm btn-outline-danger" onclick="handleAnnullaMinistero('${req.idTrans}')" title="Annulla Transazione"><i class="fas fa-undo"></i></button>`
                : `<span class="text-muted small">-</span>`;
        }

        html += `
            <tr class="${rowClass}">
                <td class="px-3">${req.data || '-'}</td>
                <td class="fw-bold">${tipoDisplay}</td>
                <td>€ ${req.importo ? Number(req.importo).toLocaleString('it-IT') : '0'}</td>
                <td>${req.controparte || '-'}</td>
                <td class="text-center"><span class="badge bg-${getBadgeColor(req.stato)}">${req.stato}</span></td>
                ${isAuthorized ? `<td class="text-center">${actionsHtml}</td>` : ''}
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

/**
 * Utility per colorare le badge degli stati
 */
function getBadgeColor(stato) {
    switch((stato || '').toUpperCase()) {
        case 'ACCETTATA': return 'success';
        case 'RIFIUTATA': return 'danger';
        case 'IN ATTESA': return 'warning text-dark';
        case 'ANNULLATA_MINISTERO': return 'secondary';
        case 'ANNULLATA_ISTITUTO': return 'secondary';
        default: return 'primary';
    }
}

/**
 * Gestisce l'accettazione o il rifiuto di una richiesta di budget
 * @param {string} id - ID univoco della transazione
 * @param {string} azione - 'ACCETTATA' o 'RIFIUTATA'
 */
function gestisciRichiesta(id, azione) {
    const labelAzione = azione === 'ACCETTATA' ? 'accettare' : 'rifiutare';
// Utilizziamo la modale di piattaforma che non blocca il browser
    confirmActionModal(`Sei sicuro di voler ${labelAzione} questa richiesta?`, () => {
        mostraLoading(true);

        google.script.run
            .withSuccessHandler((response) => {
                if(response.success) {
                    showToast(`Richiesta ${azione.toLowerCase()} con successo.`, 'success');
                    caricaDashboard(); 
                } else {
                    mostraLoading(false);
                    showToast(response.message, 'error');
                }
            })
            .withFailureHandler(errorHandler)
            .updateBudgetRequestStatus(getAuthToken(), id, azione);
    });
}

/**
 * Gestisce l'annullamento P2P di una transazione
 * @param {string} idTrans - ID univoco della transazione
 */
function handleAnnullaP2P(idTrans) {
confirmActionModal("Sei sicuro di voler annullare questa transazione? L'operazione restituirà il budget se già accettata.", () => {
        mostraLoading(true);

        google.script.run
            .withSuccessHandler(function(response) {
                mostraLoading(false);
                if (response && response.success !== false) { 
                    showToast(response.message || "Transazione annullata con successo.", "success");
                    caricaDashboard(); 
                } else {
                    showToast(response.message || "Errore sconosciuto.", "error");
                }
            })
            .withFailureHandler(function(error) {
                mostraLoading(false);
                showToast("Errore: " + error.message, "error");
            })
            .annullaTransazioneIstituzione(getAuthToken(), idTrans);
    });
}

/**
 * Gestisce l'annullamento di una transazione lato Ministero (Rollback)
 * @param {string} idTrans - ID univoco della transazione
 */
function handleAnnullaMinistero(idTrans) {
confirmActionModal("Sei sicuro di voler annullare questa transazione?\nL'operazione restituirà i fondi e lo stato passerà ad ANNULLATA MINISTERO.", () => {
        mostraLoading(true);

        google.script.run
            .withSuccessHandler(function(response) {
                mostraLoading(false);
                if (response && response.success !== false) {
                    showToast("Transazione annullata con successo dal Ministero.", "success");
                    
                    const modalEl = document.getElementById('modalDettagliAdmin');
                    if (modalEl) {
                        const modalInstance = bootstrap.Modal.getInstance(modalEl);
                        if (modalInstance) modalInstance.hide();
                    }
                    caricaDashboard(); 
                } else {
                    showToast(response.message || "Errore durante l'annullamento della transazione.", "error");
                }
            })
            .withFailureHandler(function(error) {
                mostraLoading(false);
                showToast(error.message, "error"); 
            })
            .annullaTransazioneMinistero(getAuthToken(), idTrans);
    });
}

</script>
