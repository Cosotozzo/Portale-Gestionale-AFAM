<script>
/**
 * Controller Client-Side per Modulo Scambio Budget
 * Architettura: ES6, Async Pattern con google.script.run
 */

// document.addEventListener("DOMContentLoaded", () => {
//    if(document.getElementById('scambio-budget-container')) {
//        initBudgetModulo();
//    }
// });

const initBudgetModulo = () => {
    loadDashboardData();
};

// ==========================================
// 1. LETTURA DATI (READ) E INIT DASHBOARD
// ==========================================
const loadDashboardData = () => {

google.script.run
        .withSuccessHandler(handleDashboardDataSuccess)
        .withFailureHandler(handleRpcError)
        .getBudgetDashboardData(currentUser.token); 
};

let currentMinisteroReport = []; // Cache per la modale

const handleDashboardDataSuccess = (response) => {
    if (!response.success) { showToast(response.message, "danger"); return; }
    
    try {
        if (response.isAdmin) {
            // RENDERING MINISTERO
            document.getElementById('istituzione-budget-container').classList.add('hidden');
            document.getElementById('ministero-budget-container').classList.remove('hidden');
            
            currentMinisteroReport = response.report;
            renderMinisteroTable(currentMinisteroReport);
            
        } else {
            // RENDERING ISTITUZIONE
            document.getElementById('ministero-budget-container').classList.add('hidden');
            document.getElementById('istituzione-budget-container').classList.remove('hidden');
            
            const { stats, transazioni, istituzioni } = response;

            document.getElementById('stat-saldo-iniziale').innerText = formatCurrency(stats.saldoIniziale);
            document.getElementById('stat-entrate').innerText = formatCurrency(stats.entrateAccettate);
            document.getElementById('stat-uscite-pendenza').innerText = formatCurrency(stats.uscitePendenti);
            document.getElementById('stat-saldo-disponibile').innerText = formatCurrency(stats.saldoDisponibile);
        }
        
        renderTableBudget(transazioni);
        populateSelectCedenti(istituzioni);
        
    } catch (error) {
        console.error("Errore nel parsing dei dati della dashboard:", error);
        showToast("Errore di rendering dati", "danger");
    }
};

/**
 * Gestisce il click sul Master Switch (Solo Admin)
 */
const handleMasterSwitchChange = (element) => {
    const newState = element.checked;
    element.disabled = true; // Blocco UI temporaneo
    const label = document.getElementById('masterSwitchLabel');
    label.innerText = "Salvataggio...";

    const token = (typeof currentUser !== 'undefined' && currentUser) ? currentUser.token : null;

    google.script.run
        .withSuccessHandler((res) => {
            element.disabled = false;
            if(res.success) {
                showToast(res.message, "success");
                label.innerText = newState ? "MODULO ATTIVO" : "MODULO DISATTIVATO";
                label.className = newState ? "custom-control-label font-weight-bold text-success" : "custom-control-label font-weight-bold text-danger";
            } else {
                element.checked = !newState; // Revert
                showToast(res.message, "danger");
                label.innerText = "Errore";
            }
        })
        .withFailureHandler((err) => {
            element.disabled = false;
            element.checked = !newState; // Revert
            handleRpcError(err);
        })
        .toggleScambioBudget(token, newState);
};

const renderTableBudget = (transazioni) => {
    const tbody = document.getElementById('tbodyBudget');
    
    if (!transazioni || transazioni.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-muted">Nessuna transazione trovata.</td></tr>`;
        return;
    }

    const rowsHtml = transazioni.map(t => `
        <tr>
            <td>${t.data}</td>
            <td><span class="badge ${t.tipo === 'INVIATA' ? 'bg-warning' : 'bg-info'}">${t.tipo}</span></td>
            <td>${t.partner}</td>
            <td class="font-weight-bold">€ ${t.importo}</td>
            <td>${getStatoBadge(t.stato)}</td>
            <td class="text-center">
                ${generateAzioniHtml(t)}
            </td>
        </tr>
    `).join('');
    
    tbody.innerHTML = rowsHtml;
};

// INIZIO MODIFICA
// ==========================================
// RENDERING MINISTERO
// ==========================================
const renderMinisteroTable = (report) => {
    const tbody = document.getElementById('tbodyMinisteroBudget');
    if (!report || report.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">Nessun dato disponibile.</td></tr>`;
        return;
    }
    
    tbody.innerHTML = report.map(r => {
        let coloreScambio = "text-muted";
        let sign = "";
        if (r.valoreScambio > 0) { coloreScambio = "text-success fw-bold"; sign = "+"; }
        else if (r.valoreScambio < 0) { coloreScambio = "text-danger fw-bold"; }
        
        return `
        <tr style="cursor:pointer;" onclick="openDettaglioMinistero('${r.id}')" title="Clicca per visualizzare i dettagli">
            <td class="fw-bold text-primary">${r.nome}</td>
            <td class="text-end">${formatCurrency(r.budgetBase)}</td>
            <td class="text-end ${coloreScambio}">${sign}${formatCurrency(r.valoreScambio)}</td>
            <td class="text-end fw-bold">${formatCurrency(r.residuo)}</td>
        </tr>
    `}).join('');
};

const filterMinisteroBudget = () => {
    const val = document.getElementById('searchMinisteroTable').value.toLowerCase();
    const rows = document.querySelectorAll('#tbodyMinisteroBudget tr');
    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(val) ? "" : "none";
    });
};

const openDettaglioMinistero = (idIst) => {
    const istData = currentMinisteroReport.find(r => r.id === idIst);
    if (!istData) return;
    
    document.getElementById('modalDettagliTitle').innerText = `Movimentazioni: ${istData.nome}`;
    const tbody = document.getElementById('tbodyDettagliTransazioni');
    
    if (!istData.transazioni || istData.transazioni.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-3 text-muted">Nessuna transazione registrata.</td></tr>`;
    } else {
        tbody.innerHTML = istData.transazioni.map(t => `
            <tr>
                <td class="small text-muted">${t.data}</td>
                <td class="small fw-bold">${t.tipo}</td>
                <td>${getStatoBadge(t.stato)}</td>
                <td class="text-end fw-bold">€ ${t.importo.toFixed(2)}</td>
            </tr>
        `).join('');
    }
    
    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDettagliMinistero'));
    modal.show();
};

// ==========================================
// 2. SCRITTURA DATI (WRITE)
// ==========================================
const openNuovaRichiestaModal = () => {
    document.getElementById('formRichiestaBudget').reset();
    const modalEl = document.getElementById('modalRichiestaBudget');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
};

const submitRichiestaBudget = () => {
    const btnSubmit = document.querySelector('#modalRichiestaBudget .btn-primary');
    const form = document.getElementById('formRichiestaBudget');
    
    if(!form.checkValidity()) {
        form.reportValidity();
        return;
    }

    // Costruzione Payload
    const payload = {
        cedenteId: document.getElementById('selectCedente').value,
        importo: parseFloat(document.getElementById('inputImporto').value).toFixed(2),
        note: document.getElementById('inputNote').value.trim()
    };

    if(payload.importo <= 0) {
        showToast("L'importo deve essere maggiore di zero.", "warning");
        return;
    }

    // Lock UI
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Invio...`;

google.script.run
        .withSuccessHandler((res) => {
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalRichiestaBudget'));
            modal.hide();
            showToast("Richiesta inviata con successo!", "success");
            loadDashboardData(); // Refresh silente
        })
        .withFailureHandler((err) => {
            handleRpcError(err);
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `Invia Richiesta Ufficiale`;
        })
        .submitBudgetRequest(currentUser.token, payload); 
};

// ==========================================
// 3. UTILITIES
// ==========================================
const populateSelectCedenti = (istituzioni) => {
    const select = document.getElementById('selectCedente');
    if(!select) return;
    
    select.innerHTML = `<option value="" selected disabled>Seleziona un'istituzione...</option>`;
    if(istituzioni) {
        istituzioni.forEach(ist => {
            select.innerHTML += `<option value="${ist.id}">${ist.nome}</option>`;
        });
    }
};

const formatCurrency = (amount) => {
    return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(amount);
};

const getStatoBadge = (stato) => {
    const map = {
        'BOZZA_RICHIEDENTE': '<span class="badge bg-secondary">Bozza (Rich.)</span>',
        'INVIATA': '<span class="badge bg-primary">Inviata</span>',
        'BOZZA_CEDENTE': '<span class="badge bg-secondary">Bozza (Cedente)</span>',
        'ACCETTATA': '<span class="badge bg-success">Accettata</span>',
        'RIFIUTATA': '<span class="badge bg-danger">Rifiutata</span>',
        'IN_INTEGRAZIONE': '<span class="badge bg-warning text-dark">In Integrazione</span>',
        'ANNULLATA_MINISTERO': '<span class="badge bg-dark">Annullata (Min.)</span>'
    };
    return map[stato] || `<span class="badge bg-light text-dark">${stato}</span>`;
};

const generateAzioniHtml = (transazione) => {
    let html = '';
    
    if (transazione.tipo === 'RICEVUTA') {
        if (transazione.stato === 'INVIATA' || transazione.stato === 'BOZZA_CEDENTE') {
            html += `<button class="btn btn-sm btn-success mx-1" onclick="gestisciRichiesta('${transazione.id}', 'ACCETTA')">Accetta</button>`;
            html += `<button class="btn btn-sm btn-danger mx-1" onclick="gestisciRichiesta('${transazione.id}', 'RIFIUTA')">Rifiuta</button>`;
            html += `<button class="btn btn-sm btn-warning mx-1" onclick="gestisciRichiesta('${transazione.id}', 'IN_INTEGRAZIONE')">Chiedi Integ.</button>`;
        }
    } else if (transazione.tipo === 'INVIATA') {
        if (transazione.stato === 'BOZZA_RICHIEDENTE') {
            html += `<button class="btn btn-sm btn-primary mx-1" onclick="gestisciRichiesta('${transazione.id}', 'INVIA')">Invia Definitivo</button>`;
            html += `<button class="btn btn-sm btn-outline-danger mx-1" onclick="gestisciRichiesta('${transazione.id}', 'ELIMINA_BOZZA')">Elimina</button>`;
        } else if (transazione.stato === 'IN_INTEGRAZIONE') {
            html += `<button class="btn btn-sm btn-warning mx-1" onclick="modificaRichiesta('${transazione.id}')">Modifica/Integra</button>`;
        }
    }
    
    return html || '-';
};

const handleRpcError = (error) => {
    console.error("RPC Error:", error);
    showToast(error.message || "Si è verificato un errore di rete.", "danger");
};

const showToast = (message, type) => {
    if(typeof app !== 'undefined' && app.showToast) {
        app.showToast(message, type);
    } else {
        alert(`${type.toUpperCase()}: ${message}`);
    }
};
</script>
