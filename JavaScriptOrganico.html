<script>
/**
 * PORTALE GESTIONALE AFAM - Modulo Scambio Budget Organico
 * Logic Controller (Frontend) - Versione Consolidata
 */

// ==========================================
// 1. STATO GLOBALE E COSTANTI
// ==========================================
let currentMinisteroReport = [];

/**
 * Gestore centralizzato degli stati della UI (Anti-Flickering)
 * @param {string} viewType - 'LOADING', 'ISTITUZIONE', 'MINISTERO'
 */
const switchBudgetView = (viewType) => {
    const loader = document.getElementById('scambio-budget-loader');
    const viewIst = document.getElementById('istituzione-budget-container');
    const viewMin = document.getElementById('ministero-budget-container');
    
    // Nascondi tutti i container preventivamente
    if(loader) loader.classList.add('d-none');
    if(viewIst) viewIst.classList.add('d-none');
    if(viewMin) viewMin.classList.add('d-none');

    // Mostra esclusivamente la vista richiesta
    switch(viewType) {
        case 'LOADING':
            if(loader) loader.classList.remove('d-none');
            break;
        case 'ISTITUZIONE':
            if(viewIst) viewIst.classList.remove('d-none');
            break;
        case 'MINISTERO':
            if(viewMin) viewMin.classList.remove('d-none');
            break;
    }
};

// ==========================================
// 2. INIZIALIZZAZIONE E CARICAMENTO DATI
// ==========================================

/**
 * Entry point del modulo chiamato dal controller principale (JavaScript.html)
 */
const initBudgetModulo = () => {
    console.log("Budget Module: Avvio inizializzazione...");
    if (!currentUser || !currentUser.token) {
        console.error("Budget Module: Errore di autenticazione (Token assente)");
        showToast("Sessione non valida. Ricaricare la pagina.", "danger");
        return;
    }

    // Attiva il loader prima di ogni operazione
    switchBudgetView('LOADING');
    loadDashboardData();
};

/**
 * Determina quale dashboard caricare in base al ruolo
 */
const loadDashboardData = () => {
    // Se l'utente è ADMIN o MINISTERO (Check basato su Index.html logic)
    if (currentUser.role === 'ADMIN' || currentUser.role === 'MINISTERO') {
        loadMinisteroDashboard();
    } else {
        loadIstituzioneDashboard();
    }
};

const loadIstituzioneDashboard = () => {
google.script.run
        .withSuccessHandler(response => {
            if (!response.success) {
                handleRpcError(new Error(response.message));
                return;
            }
            console.log("Budget Module: Dati Istituzione caricati");
            renderIstituzioneTable(response.transazioni);
            updateStatsCards(response.stats);
            switchBudgetView('ISTITUZIONE');
        })
        .withFailureHandler(handleRpcError)
        .getBudgetDashboardData(currentUser.token);
};

const loadMinisteroDashboard = () => {
google.script.run
        .withSuccessHandler(response => {
            if (!response.success) {
                handleRpcError(new Error(response.message));
                return;
            }
            console.log("Budget Module: Report Ministeriale caricato");
            currentMinisteroReport = response.report;
            renderMinisteroTable(response.report);
            
            // Gestione Master Switch basato sulla risposta
            const masterSwitch = document.getElementById('masterSwitchBudget');
            const switchLabel = document.getElementById('masterSwitchLabel');
            if (masterSwitch && switchLabel) {
                masterSwitch.checked = response.isAttivo;
                switchLabel.innerText = response.isAttivo ? "MODULO ATTIVO" : "MODULO DISATTIVATO";
            }
            
            switchBudgetView('MINISTERO');
        })
        .withFailureHandler(handleRpcError)
        .getBudgetDashboardData(currentUser.token);
};

// ==========================================
// 3. GESTIONE AZIONI E MODALI
// ==========================================

/**
 * Apre la modale per una nuova richiesta resettando lo stato UI
 */
const openNuovaRichiestaModal = () => {
    const form = document.getElementById('formRichiestaBudget');
    if(form) form.reset();
    
    // Reset profondo del pulsante (rimuove spinner e lock precedenti)
    const btnSubmit = document.querySelector('#modalRichiestaBudget .btn-primary');
    if(btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fas fa-paper-plane me-2"></i>Invia Richiesta Ufficiale`;
    }

    const modalEl = document.getElementById('modalRichiestaBudget');
    if(modalEl) {
        const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();
    } else {
        console.error("Errore: Modale 'modalRichiestaBudget' non trovata nel DOM.");
    }
};

/**
 * Apre il dettaglio delle transazioni di una specifica istituzione (Lato Admin)
 */
const openDettaglioMinistero = (idIst) => {
    const istData = currentMinisteroReport.find(r => r.id === idIst);
    if (!istData) return;
    
    // Fix: Assicura che gli ID esistano nel DOM (ScambioBudgetOrganico.html)
    const titleEl = document.getElementById('modalDettagliTitle');
    const tbody = document.getElementById('tbodyDettagliTransazioni');
    
    if(titleEl) titleEl.innerText = `Movimentazioni: ${istData.nome}`;
    if(tbody) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>';
        
        // Chiamata per recuperare lo storico transazioni
        google.script.run
            .withSuccessHandler(transazioni => {
                renderDettagliTransazioni(transazioni);
            })
            .withFailureHandler(handleRpcError)
            .getTransazioniIstituzione(idIst);
    }

    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDettagliMinistero'));
    modal.show();
};

/**
 * Invia la richiesta al server con feedback visivo
 */
const submitRichiestaBudget = () => {
    const btnSubmit = document.querySelector('#modalRichiestaBudget .btn-primary');
    const idCedente = document.getElementById('selectCedente').value;
    const importo = document.getElementById('inputImporto').value;
    const note = document.getElementById('inputNote').value;

    if (!idCedente || !importo) {
        showToast("Compila tutti i campi obbligatori", "warning");
        return;
    }

    // UI Loading State
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm mr-2"></span> Invio in corso...`;

    google.script.run
        .withSuccessHandler(response => {
            showToast("Richiesta inviata con successo", "success");
            bootstrap.Modal.getInstance(document.getElementById('modalRichiestaBudget')).hide();
            loadIstituzioneDashboard(); // Ricarica i dati
        })
        .withFailureHandler(error => {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `Invia Richiesta Ufficiale`;
            handleRpcError(error);
        })
        .createRichiestaBudget(currentUser.idIstituzione, idCedente, importo, note);
};

// ==========================================
// 4. UTILITY E ERROR HANDLING
// ==========================================

const handleRpcError = (error) => {
    console.error("RPC Error:", error);
    // Nota: showToast è definita globalmente in JavaScript.html
    showToast(error.message || "Errore di comunicazione con il server", "danger");
    
    // In caso di errore critico al caricamento, nascondi il loader
    const loader = document.getElementById('scambio-budget-loader');
    if(loader) loader.classList.add('d-none');
};

/**
 * Rendering tabelle (Esempio logica)
 */
function renderIstituzioneTable(data) {
    const tbody = document.getElementById('tbodyIstituzioneBudget');
    if(!tbody) return;
    // ... logica di popolamento tabella ...
}

function renderMinisteroTable(data) {
    const tbody = document.getElementById('tbodyMinisteroBudget');
    if(!tbody) return;
    // ... logica di popolamento tabella ...
}

function updateStatsCards(stats) {
    if (!stats) return;
    
    const formatter = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
    
    const elBudgetDisp = document.getElementById('stat-budget-disponibile');
    const elRichiesteAttive = document.getElementById('stat-richieste-attive');
    const elScambiConclusi = document.getElementById('stat-scambi-conclusi');
    
    if (elBudgetDisp) elBudgetDisp.innerText = formatter.format(stats.saldoDisponibile);
    if (elRichiesteAttive) elRichiesteAttive.innerText = formatter.format(stats.uscitePendenti);
    if (elScambiConclusi) elScambiConclusi.innerText = formatter.format(stats.entrateAccettate);
}

</script>
