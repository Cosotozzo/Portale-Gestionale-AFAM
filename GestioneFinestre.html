<div id="view-module-finestre" class="view-section hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold" style="color: var(--header-main-bg);">Gestione Finestre di Apertura</h3>
          <p class="text-muted">Configura i periodi di accesso ai moduli per le Istituzioni.</p>
        </div>
        <button class="btn btn-primary btn-sm rounded-pill" onclick="loadFinestreTable()">
          <i class="fas fa-sync-alt me-2"></i>Aggiorna
        </button>
    </div>

<div class="d-flex justify-content-end mb-3">
        <button class="btn btn-success fw-bold rounded-pill px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuovaFinestra">
            <i class="fas fa-plus me-2"></i>Nuova Finestra di Apertura
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-custom mb-5">
        <div class="card-body p-4"> <div class="table-responsive">
                <table class="table table-hover table-sm align-middle mb-0 table-rounded"> <thead class="table-light text-uppercase small text-muted">
                        <tr>
                            <th class="px-3">Modulo</th> <th class="px-3">Tipo</th>
                            <th class="px-3">Istituzione</th>
                            <th class="px-3">Inizio</th>
                            <th class="px-3">Fine</th>
                            <th class="px-3 text-center">Stato</th>
                            <th class="px-3 text-center">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-finestre"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuovaFinestra" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-custom border-0 shadow-lg">
                <div class="modal-header border-0 p-4 pb-2">
                    <h5 class="modal-title fw-bold" style="color: var(--header-main-bg);">Aggiungi Nuova Finestra Temporale</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Seleziona Modulo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-layer-group text-muted"></i></span>
                                <select class="form-select border-start-0 ps-0" id="finestra-modulo">
                                    <option value="CESSAZIONI">Validazione Cessazioni</option>
                                    <option value="BUDGET_ORG">Scambio Budget Organico</option>
                                    <option value="BUDGET_ASS">Scambio Budget Assunzionale</option>
                                    <option value="RCA">R.C.A. e R.G.U.</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Inizio (Data e Ora)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="far fa-calendar-alt text-muted"></i></span>
                                <input type="datetime-local" class="form-control border-start-0 ps-0" id="finestra-inizio" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Tipo di Apertura</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-globe text-muted"></i></span>
                                <select class="form-select border-start-0 ps-0" id="finestra-tipo" onchange="toggleIstSelect()">
                                    <option value="GLOBALE">Globale (Tutte le Istituzioni)</option>
                                    <option value="PUNTUALE">Puntuale (Singola Istituzione)</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Fine (Data e Ora)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="far fa-calendar-check text-muted"></i></span>
                                <input type="datetime-local" class="form-control border-start-0 ps-0" id="finestra-fine" required>
                            </div>
                        </div>
                        <div class="col-md-12" id="finestra-ist-container" style="display: none;">
                            <label class="form-label small fw-bold text-muted">Istituzione (opzionale)</label>
                            <div class="input-group position-relative">
                                <span class="input-group-text bg-white"><i class="fas fa-university text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="finestra-istituzione" placeholder="Cerca istituzione..." autocomplete="off">
                                <ul class="dropdown-menu w-100 shadow" id="list-finestra-istituzione" style="max-height: 200px; overflow-y: auto;"></ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0 justify-content-end">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Annulla</button>
                    <button type="button" class="btn btn-success fw-bold rounded-pill px-4 shadow-sm" onclick="submitFinestra()">
                        <i class="fas fa-save me-2"></i>Salva Finestra
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
    function toggleIstSelect() {
        const tipo = document.getElementById('finestra-tipo').value;
        const container = document.getElementById('finestra-ist-container');
        if (tipo === 'PUNTUALE') {
            container.style.display = 'block';
            if (allInstitutions.length === 0) loadInstitutionsForFinestre();
        } else {
            container.style.display = 'none';
        }
    }

    function loadInstitutionsForFinestre() {
        google.script.run.withSuccessHandler(list => { 
            allInstitutions = list; 
            setupAutocomplete(document.getElementById('finestra-istituzione'), document.getElementById('list-finestra-istituzione'), list); 
        }).getInstitutionNames();
    }
</script>
