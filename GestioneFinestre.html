<div id="view-module-finestre" class="view-section hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold" style="color: var(--header-main-bg);">Gestione Finestre di Apertura</h3>
          <p class="text-muted">Configura i periodi di accesso ai moduli per le Istituzioni.</p>
        </div>
        <button class="btn btn-primary btn-sm rounded-pill" onclick="loadFinestreTable()">
          <i class="fas fa-sync-alt me-2"></i>Aggiorna
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-custom mb-5">
        <div class="card-body p-4 bg-light">
            <h5 class="fw-bold mb-3"><i class="fas fa-plus-circle me-2 text-primary"></i>Nuova Finestra Temporale</h5>
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">MODULO</label>
                    <select class="form-select" id="finestra-modulo">
                        <option value="CESSAZIONI">Validazione Cessazioni</option>
                        <option value="BUDGET_ORG">Scambio Budget Organico</option>
                        <option value="BUDGET_ASS">Scambio Budget Assunzionale</option>
                        <option value="RCA">R.C.A. e R.G.U.</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">TIPO APERTURA</label>
                    <select class="form-select" id="finestra-tipo" onchange="toggleIstSelect()">
                        <option value="GLOBALE">Globale (Tutte le Istituzioni)</option>
                        <option value="PUNTUALE">Puntuale (Singola Istituzione)</option>
                    </select>
                </div>
                <div class="col-md-6" id="finestra-ist-container" style="display: none;">
                    <label class="form-label small fw-bold text-muted">ISTITUZIONE</label>
                    <div class="position-relative">
                        <input type="text" class="form-control" id="finestra-istituzione" placeholder="Cerca istituzione..." autocomplete="off">
                        <ul class="dropdown-menu w-100 shadow" id="list-finestra-istituzione" style="max-height: 200px; overflow-y: auto;"></ul>
                    </div>
                </div>
            </div>
            <div class="row g-3 mt-1 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">DATA E ORA INIZIO</label>
                    <input type="datetime-local" class="form-control" id="finestra-inizio" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">DATA E ORA FINE</label>
                    <input type="datetime-local" class="form-control" id="finestra-fine" required>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-success fw-bold px-4 w-100" onclick="submitFinestra()"><i class="fas fa-save me-2"></i>Salva Finestra</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-custom mb-5">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 table-rounded">
                <thead class="table-light text-uppercase small text-muted">
                    <tr>
                        <th>Modulo</th>
                        <th>Tipo</th>
                        <th>Istituzione</th>
                        <th>Inizio</th>
                        <th>Fine</th>
                        <th class="text-center">Stato</th>
                        <th class="text-center">Azioni</th>
                    </tr>
                </thead>
                <tbody id="tbody-finestre"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function toggleIstSelect() {
        const tipo = document.getElementById('finestra-tipo').value;
        const container = document.getElementById('finestra-ist-container');
        if (tipo === 'PUNTUALE') {
            container.style.display = 'block';
            if (allInstitutions.length === 0) loadInstitutionsForFinestre();
        } else {
            container.style.display = 'none';
        }
    }

    function loadInstitutionsForFinestre() {
        google.script.run.withSuccessHandler(list => { 
            allInstitutions = list; 
            setupAutocomplete(document.getElementById('finestra-istituzione'), document.getElementById('list-finestra-istituzione'), list); 
        }).getInstitutionNames();
    }
</script>
